<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — AttendRFID</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="bg-grid"></div>
  <div class="bg-glow" style="background: radial-gradient(ellipse at center, rgba(245,158,11,0.07) 0%, transparent 70%);"></div>

  <div class="login-wrapper">
    <a href="index.html" class="login-back">← Back to Portals</a>
    <div class="login-card">
      <div class="login-header">
        <div class="login-role-badge admin-badge">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
          Admin Panel
        </div>
        <h2>System<br>Administrator</h2>
        <p>Full access to all attendance records and system configuration</p>
      </div>

      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" class="form-control" id="admin-user" placeholder="admin" value="admin">
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" class="form-control" id="admin-pass" placeholder="Enter admin password" value="admin@2024">
      </div>

      <button class="btn btn-admin" onclick="adminLogin()">Access Admin Panel</button>

      <div class="demo-creds">
        <p><strong>Demo Credentials</strong><br>
        Username: <strong>admin</strong><br>
        Password: <strong>admin@2024</strong></p>
      </div>
    </div>
  </div>

  <script>
    function adminLogin() {
      const user = document.getElementById('admin-user').value.trim();
      const pass = document.getElementById('admin-pass').value.trim();
      if (user === 'admin' && pass === 'admin@2024') {
        sessionStorage.setItem('isAdmin', 'true');
        window.location.href = 'admin-dashboard.html';
      } else {
        alert('Invalid admin credentials.');
      }
    }
    document.addEventListener('keydown', e => { if(e.key === 'Enter') adminLogin(); });
  </script>
</body>
</html>
