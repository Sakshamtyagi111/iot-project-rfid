<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login — AttendRFID</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="bg-grid"></div>
  <div class="bg-glow" style="background: radial-gradient(ellipse at center, rgba(34,197,94,0.07) 0%, transparent 70%);"></div>

  <div class="login-wrapper">
    <a href="index.html" class="login-back">← Back to Portals</a>
    <div class="login-card">
      <div class="login-header">
        <div class="login-role-badge teacher-badge">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
          Teacher Portal
        </div>
        <h2>Welcome back,<br>Educator</h2>
        <p>Sign in to view your subject attendance records</p>
      </div>

      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" class="form-control" id="teacher-id" placeholder="e.g. TCH-2024-001" value="TCH-2024-001">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" id="teacher-pass" placeholder="Enter password" value="teacher123">
      </div>

      <button class="btn btn-teacher" onclick="teacherLogin()">Sign In to Teacher Portal</button>

      <div class="demo-creds">
        <p><strong>Demo Credentials</strong><br>
        ID: TCH-2024-001 &nbsp;|&nbsp; Pass: teacher123 (Physics)<br>
        ID: TCH-2024-002 &nbsp;|&nbsp; Pass: teacher123 (Math)<br>
        ID: TCH-2024-003 &nbsp;|&nbsp; Pass: teacher123 (Chemistry)</p>
      </div>
    </div>
  </div>

  <script>
    const TEACHERS = {
      'TCH-2024-001': { name: 'Dr. Anil Sharma', subject: 'Physics', subjectCode: 'PHY101', pass: 'teacher123' },
      'TCH-2024-002': { name: 'Prof. Meena Gupta', subject: 'Mathematics', subjectCode: 'MAT201', pass: 'teacher123' },
      'TCH-2024-003': { name: 'Dr. Raj Verma', subject: 'Chemistry', subjectCode: 'CHE101', pass: 'teacher123' },
    };

    function teacherLogin() {
      const id = document.getElementById('teacher-id').value.trim();
      const pass = document.getElementById('teacher-pass').value.trim();
      if (TEACHERS[id] && TEACHERS[id].pass === pass) {
        sessionStorage.setItem('teacherID', id);
        sessionStorage.setItem('teacherData', JSON.stringify(TEACHERS[id]));
        window.location.href = 'teacher-dashboard.html';
      } else {
        alert('Invalid credentials. Please check your ID and password.');
      }
    }
    document.addEventListener('keydown', e => { if(e.key === 'Enter') teacherLogin(); });
  </script>
</body>
</html>
